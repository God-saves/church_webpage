<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Recommended Resource</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // Simple admin password check
    const ADMIN_PASSWORD = "Pastor2026!"; // <-- Change this to whatever password you used for sermons!
    
    const userPass = prompt("Enter the Pastor / Admin password to access this page:");
    if (userPass !== ADMIN_PASSWORD) {
      alert("Incorrect password. Redirecting to home page.");
      window.location.href = "index.html";
    }
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa;
      color: #2c3e50;
      padding: 40px 20px;
      margin: 0;
    }
    .form-card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; color: #1a2522; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background-color: #1a2522;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background-color: #2c3e50; }
    .status-msg { text-align: center; margin-top: 15px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Post a Recommended Article</h2>
    <form id="resourceForm">
      <div class="form-group">
        <label for="title">Article Title *</label>
        <input type="text" id="title" placeholder="e.g., Understanding Grace" required>
      </div>

      <div class="form-group">
        <label for="url">Article Web Link (URL) *</label>
        <input type="url" id="url" placeholder="https://example.com/article" required>
      </div>

      <div class="form-group">
        <label for="author">Author or Website Name</label>
        <input type="text" id="author" placeholder="e.g., Gospel Coalition / John Smith">
      </div>

      <div class="form-group">
        <label for="description">Why read this? (Short Note)</label>
        <textarea id="description" rows="3" placeholder="A brief encouragement or summary..."></textarea>
      </div>

      <button type="submit">Publish Resource</button>
      <div id="status" class="status-msg"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://jnrhwrrlyxwycdgccdmk.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impucmh3cnJseXh3eWNkZ2NjZG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NTk3MDEsImV4cCI6MjEwMDUzNTcwMX0.FWhCkyeoBhQx7hQ4zc_rRbEoNdywrF1YjLFvJ-qToFo";

    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false }
    });

    document.getElementById('resourceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('status');
      statusDiv.style.color = '#666';
      statusDiv.innerText = 'Publishing...';

      const title = document.getElementById('title').value;
      const url = document.getElementById('url').value;
      const author = document.getElementById('author').value;
      const description = document.getElementById('description').value;

      const { error } = await _supabase
        .from('resources')
        .insert([{ title, url, author, description }]);

      if (error) {
        console.error(error);
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'Error publishing resource.';
      } else {
        statusDiv.style.color = 'green';
        statusDiv.innerText = '✅ Resource Published Successfully!';
        document.getElementById('resourceForm').reset();
      }
    });
  </script>
</body>
</html>

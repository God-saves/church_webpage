<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sermons</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #1a2522;
      margin-bottom: 30px;
    }
    .sermon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 24px;
    }
    .sermon-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      background-color: #000;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .sermon-info {
      padding: 20px;
    }
    .sermon-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2c3e50;
      margin: 0 0 8px 0;
    }
    .sermon-date {
      color: #6c757d;
      font-size: 0.9rem;
      margin: 0;
    }
    .status-msg {
      text-align: center;
      color: #666;
      font-size: 1.1rem;
      padding: 40px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Latest Sermons</h1>
    <div id="sermonsList" class="status-msg">Loading sermons...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://jnrhwrrlyxwycdgccdmk.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impucmh3cnJseXh3eWNkZ2NjZG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NTk3MDEsImV4cCI6MjEwMDUzNTcwMX0.FWhCkyeoBhQx7hQ4zc_rRbEoNdywrF1YjLFvJ-qToFo";

    function getEmbedUrl(url) {
      if (!url) return '';
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) 
        ? 'https://www.youtube-nocookie.com/embed/' + match[2] 
        : url;
    }

    async function loadSermons() {
      const container = document.getElementById('sermonsList');
      
      try {
        // Direct REST API fetch (Bypasses library load issues)
        const response = await fetch(`${SUPABASE_URL}/rest/v1/sermons?select=*&order=date.desc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const sermons = await response.json();

        if (!sermons || sermons.length === 0) {
          container.innerHTML = 'No sermons published yet!';
          return;
        }

        container.className = 'sermon-grid';
        container.innerHTML = sermons.map(sermon => `
          <div class="sermon-card">
            <div class="video-container">
              <iframe 
                src="${getEmbedUrl(sermon.video_url)}" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
              </iframe>
            </div>
            <div class="sermon-info">
              <h3 class="sermon-title">${sermon.title || 'Untitled Sermon'}</h3>
              <p class="sermon-date">Preached on: ${sermon.date || 'N/A'}</p>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error('Fetch error:', err);
        container.innerHTML = '⚠️ Could not load sermons. Please check your internet connection or console.';
      }
    }

    // Run load on window ready
    window.addEventListener('DOMContentLoaded', loadSermons);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommended Resources - Calvary Baptist Church</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #4f5f51;
      color: #ffffff;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 35px;
      font-size: 2.5rem;
      border-bottom: 3px solid #D47A5B;
      padding-bottom: 12px;
    }
    .resource-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .resource-card {
      background: #333333;
      padding: 24px 28px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border-left: 5px solid #D47A5B;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .resource-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .resource-title {
      font-size: 1.35rem;
      font-weight: bold;
      margin: 0 0 8px 0;
    }
    .resource-title a {
      color: #ffffff;
      text-decoration: none;
    }
    .resource-title a:hover {
      color: #D47A5B;
    }
    .resource-meta {
      font-size: 0.88rem;
      color: #bbbbbb;
      margin-bottom: 14px;
      font-style: italic;
    }
    .resource-desc {
      margin: 0 0 18px 0;
      color: #e0e0e0;
      line-height: 1.6;
      font-size: 0.98rem;
    }
    .read-btn {
      display: inline-block;
      background-color: #D47A5B;
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }
    .read-btn:hover {
      background-color: #b86245;
    }
    .loading-msg {
      text-align: center;
      color: #ffffff;
      font-size: 1.2rem;
      padding: 40px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Recommended Reading & Articles</h1>
    <div id="resourcesList" class="loading-msg">Loading resources...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://jnrhwrrlyxwycdgccdmk.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impucmh3cnJseXh3eWNkZ2NjZG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NTk3MDEsImV4cCI6MjEwMDUzNTcwMX0.FWhCkyeoBhQx7hQ4zc_rRbEoNdywrF1YjLFvJ-qToFo";

    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false }
    });

    async function fetchResources() {
      const container = document.getElementById('resourcesList');
      const { data: resources, error } = await _supabase
        .from('resources')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p>Error loading articles.</p>';
        return;
      }

      if (!resources || resources.length === 0) {
        container.innerHTML = '<p>No articles posted yet!</p>';
        return;
      }

      container.className = 'resource-list';
      container.innerHTML = resources.map(item => `
        <div class="resource-card">
          <h2 class="resource-title">
            <a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.title}</a>
          </h2>
          <div class="resource-meta">
            ${item.author ? `By ${item.author} • ` : ''} 
            Posted on ${new Date(item.created_at).toLocaleDateString()}
          </div>
          ${item.description ? `<p class="resource-desc">${item.description}</p>` : ''}
          <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="read-btn">Read Article ↗</a>
        </div>
      `).join('');
    }

    fetchResources();
  </script>
</body>
</html>
